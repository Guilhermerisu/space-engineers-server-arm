services:
  downloader:
    build:
      context: .
      dockerfile: Dockerfile.depot

    platform: linux/arm64

    volumes:
      - ./server:/server

    command:
      - -app
      - "298740"
      - -depot
      - "298741"
      - -dir
      - /server
      - -validate

    restart: "no"

  space-engineers:
    build:
      context: .

    platform: linux/arm64

    restart: unless-stopped

    ports:
      - "27116:27116/udp"
      - "8866:8866/udp"

    volumes:
      - ./server:/server
      - ./data:/data

    environment:
      WINEPREFIX: /data/wine
      WINEARCH: win64
      XDG_CACHE_HOME: /data/cache

    stop_grace_period: 60s
